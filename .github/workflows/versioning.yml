name: 版本与构建一致性

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 校验版本与既有发行记录
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            node scripts/versioning.mjs check --release --tag "$REF_NAME"
          elif [ -n "$BASE_REF" ] && [ "$BASE_REF" != 0000000000000000000000000000000000000000 ]; then
            node scripts/versioning.mjs check --base-ref "$BASE_REF"
          else
            node scripts/versioning.mjs check
          fi
      - run: node --test scripts/versioning.test.mjs
      - name: 安装后端锁定依赖
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps -e backend
      - name: 验证元信息与认证边界
        run: python -m pytest backend/tests/test_product_version.py deploy/tests/test_web.py -q
      - run: npm ci --strict-peer-deps
        working-directory: frontend
      - run: npm test -- --maxWorkers=1
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: 验证 tag 的镜像元信息
        if: github.ref_type == 'tag'
        env:
          ORG_RELEASE_TAG: ${{ github.ref_name }}
          ORG_COMMIT_SHA: ${{ github.sha }}
        run: |
          docker build --build-arg ORG_RELEASE_TAG="$ORG_RELEASE_TAG" --build-arg ORG_COMMIT_SHA="$ORG_COMMIT_SHA" --build-arg ORG_SOURCE_DIRTY=false -t organization-version-check .
          docker run --rm --entrypoint python organization-version-check -c 'import json; from pathlib import Path; from app.version import product_build_info; info=product_build_info(); assert info == json.loads(Path("/srv/frontend/dist/build-info.json").read_text()); assert info["stage"] in {"release", "prerelease"}'
