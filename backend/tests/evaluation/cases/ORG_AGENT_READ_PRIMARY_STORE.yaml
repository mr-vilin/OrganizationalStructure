schema_version: 1
case_id: ORG_AGENT_READ_PRIMARY_STORE
goal: 查询合成员工 eval_employee_primary 的全部门店归属、主部门、主门店及主门店状态，并说明主部门依据。
fixture:
  dataset_state:
    id: 1
    dataset_epoch: test-eval-primary-store
    data_version: 1
    initialization_status: complete
    coverage_status: complete
  # 按外键依赖排列；所有名称均为合成数据。
  departments:
    - {id: hq, feishu_department_id: hq, parent_id: null, name: 测试总部, status: active, sync_quality: complete, is_virtual_root: false}
    - {id: store_people, feishu_department_id: store_people, parent_id: hq, name: 测试人民店, status: active, sync_quality: complete, is_virtual_root: false}
    - {id: store_river, feishu_department_id: store_river, parent_id: hq, name: 测试滨江店, status: active, sync_quality: complete, is_virtual_root: false}
    - {id: people_service, feishu_department_id: people_service, parent_id: store_people, name: 测试人民店服务组, status: active, sync_quality: complete, is_virtual_root: false}
    - {id: river_service, feishu_department_id: river_service, parent_id: store_river, name: 测试滨江店服务组, status: active, sync_quality: complete, is_virtual_root: false}
  employees:
    - {id: eval_employee_primary, feishu_user_id: eval_employee_primary, name: 测试员工甲, status: active, sync_quality: complete, primary_department_id: people_service, primary_store_status: resolved}
  # 非主部门在前；禁止按数组顺序推导主部门。
  employee_departments:
    - {employee_id: eval_employee_primary, department_id: river_service, is_primary: false, active: true}
    - {employee_id: eval_employee_primary, department_id: people_service, is_primary: true, active: true}
  store_profiles:
    - {department_id: store_people, is_store: true, store_code: EVAL_PEOPLE, notes: 合成评测门店}
    - {department_id: store_river, is_store: true, store_code: EVAL_RIVER, notes: 合成评测门店}
  # 固定投影由夹具给定，不调用生产归属函数生成答案；path 从所属部门到最近门店。
  employee_stores:
    - {employee_id: eval_employee_primary, store_id: store_river, is_primary: false, path: [river_service, store_river]}
    - {employee_id: eval_employee_primary, store_id: store_people, is_primary: true, path: [people_service, store_people]}
  system_settings:
    - {key: reconcile_schedule, value: '{"enabled": false, "local_time": "03:00", "timezone": "Asia/Shanghai", "updated_at": null}'}
  fake_feishu:
    scenario_id: ORG_AGENT_READ_PRIMARY_STORE
    # 只读用例不应调用上游；Fake 仍必须独立记录所有写尝试。
    responses: []
allowed_tools: [get_employee, get_department, list_stores, get_store, list_store_employees]
