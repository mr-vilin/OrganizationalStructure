<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"><rect x="0" y="0" width="1440" height="900" rx="0" fill="#f5f7fa" stroke="#f5f7fa"/><rect x="0" y="0" width="208" height="900" rx="0" fill="#fff" stroke="#e7eaf0"/><rect x="20" y="22" width="32" height="32" rx="8" fill="#1677ff" stroke="#1677ff"/><text x="27" y="44" font-size="19" fill="#fff" font-weight="600">组</text><text x="64" y="36" font-size="18" fill="#172b4d" font-weight="600">组织服务</text><text x="64" y="54" font-size="9" fill="#98a2b3" font-weight="400">ORGANIZATION</text><text x="29" y="105" font-size="20" fill="#7b8798" font-weight="400">◇</text><text x="62" y="105" font-size="14" fill="#475467" font-weight="400">组织架构</text><text x="29" y="157" font-size="20" fill="#7b8798" font-weight="400">▦</text><text x="62" y="157" font-size="14" fill="#475467" font-weight="400">门店管理</text><text x="29" y="209" font-size="20" fill="#7b8798" font-weight="400">↻</text><text x="62" y="209" font-size="14" fill="#475467" font-weight="400">同步中心</text><text x="29" y="261" font-size="20" fill="#7b8798" font-weight="400">≡</text><text x="62" y="261" font-size="14" fill="#475467" font-weight="400">变更日志</text><rect x="12" y="288" width="184" height="42" rx="7" fill="#eaf3ff" stroke="#eaf3ff"/><text x="29" y="313" font-size="20" fill="#1677ff" font-weight="400">⚙</text><text x="62" y="313" font-size="14" fill="#1677ff" font-weight="600">管理设置</text><path d="M20 789 L188 789" stroke="#e7eaf0"/><rect x="24" y="809" width="88" height="25" rx="4" fill="#f1f3f6" stroke="#f1f3f6"/><text x="33" y="826" font-size="12" fill="#667085" font-weight="400">单企业实例</text><text x="24" y="861" font-size="12" fill="#98a2b3" font-weight="400">内部管理工作台</text><rect x="208" y="0" width="1232" height="64" rx="0" fill="#fff" stroke="#e7eaf0"/><text x="236" y="39" font-size="14" fill="#344054" font-weight="600">示例餐饮集团</text><text x="1090" y="39" font-size="12" fill="#98a2b3" font-weight="400">设计原型 · 示例数据</text><rect x="1270" y="21" width="60" height="25" rx="4" fill="#eaf3ff" stroke="#eaf3ff"/><text x="1279" y="38" font-size="12" fill="#1677ff" font-weight="400">管理员</text><text x="236" y="98" font-size="12" fill="#8b96a7" font-weight="400">工作台  /  管理设置</text><text x="236" y="139" font-size="26" fill="#172b4d" font-weight="600">管理设置</text><text x="236" y="167" font-size="13" fill="#7b8798" font-weight="400">配置连接、管理员资格、只读 API 客户端和每日核对。</text><text x="236" y="879" font-size="11" fill="#98a2b3" font-weight="400">UI 评审稿  /  2026.09.15     ·     Python + React / Ant Design     ·     非实时业务数据</text><rect x="236" y="192" width="1176" height="654" rx="8" fill="#ffffff" stroke="#e7eaf0"/><text x="260" y="232" font-size="15" fill="#667085" font-weight="400">飞书连接</text><text x="404" y="232" font-size="15" fill="#667085" font-weight="400">管理员白名单</text><text x="592" y="232" font-size="15" fill="#1677ff" font-weight="600">API 客户端</text><text x="758" y="232" font-size="15" fill="#667085" font-weight="400">每日核对</text><path d="M252 254 L1396 254" stroke="#e7eaf0"/><path d="M584 254 L686 254" stroke="#1677ff" stroke-width="3"/><rect x="260" y="278" width="1128" height="64" rx="6" fill="#f0f6ff" stroke="#cfe1ff"/><text x="276" y="302" font-size="14" fill="#285b9c" font-weight="600">每个业务系统使用独立只读凭据</text><text x="276" y="324" font-size="12" fill="#697586" font-weight="400">凭据仅允许读取 /api/v1；已有密钥不回显，新建或轮换后仅展示一次。</text><text x="260" y="385" font-size="18" fill="#263449" font-weight="600">只读 API 客户端</text><rect x="1196" y="360" width="190" height="34" rx="6" fill="#1677ff" stroke="#1677ff"/><text x="1210" y="382" font-size="14" fill="#fff" font-weight="400">创建客户端</text><rect x="252" y="412" width="1144" height="43" rx="0" fill="#f8fafc" stroke="#f8fafc"/><text x="268" y="439" font-size="12" fill="#667085" font-weight="600">使用方</text><text x="488" y="439" font-size="12" fill="#667085" font-weight="600">凭据显示</text><text x="843" y="439" font-size="12" fill="#667085" font-weight="600">状态</text><text x="993" y="439" font-size="12" fill="#667085" font-weight="600">最近调用</text><text x="1183" y="439" font-size="12" fill="#667085" font-weight="600">操作</text><text x="268" y="488" font-size="13" fill="#344054" font-weight="400">资产管理系统</text><text x="488" y="488" font-size="13" fill="#344054" font-weight="400">仅显示凭据标识 · cli_asset</text><text x="843" y="488" font-size="13" fill="#344054" font-weight="400">启用</text><text x="993" y="488" font-size="13" fill="#344054" font-weight="400">今天 10:18</text><text x="1183" y="488" font-size="13" fill="#1677ff" font-weight="400">轮换 / 撤销</text><path d="M252 512 L1396 512" stroke="#e7eaf0"/><text x="268" y="545" font-size="13" fill="#344054" font-weight="400">薪资核对服务</text><text x="488" y="545" font-size="13" fill="#344054" font-weight="400">仅显示凭据标识 · cli_payroll</text><text x="843" y="545" font-size="13" fill="#344054" font-weight="400">启用</text><text x="993" y="545" font-size="13" fill="#344054" font-weight="400">昨天 18:40</text><text x="1183" y="545" font-size="13" fill="#1677ff" font-weight="400">轮换 / 撤销</text><path d="M252 569 L1396 569" stroke="#e7eaf0"/><text x="260" y="640" font-size="16" fill="#263449" font-weight="600">访问边界</text><text x="260" y="681" font-size="14" fill="#667085" font-weight="400">管理端：飞书登录 + 管理员白名单；移出白名单或确认离职后撤销会话。</text><text x="260" y="720" font-size="14" fill="#667085" font-weight="400">飞书连接：展示应用与权限摘要；应用密钥仅录入或轮换。</text><text x="260" y="759" font-size="14" fill="#667085" font-weight="400">每日核对：默认北京时间 03:00；重叠任务合并或排队。</text><text x="260" y="806" font-size="12" fill="#98a2b3" font-weight="400">凭据轮换和撤销需要确认；密钥不会进入日志或已有配置响应。</text></g></svg>