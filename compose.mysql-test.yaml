name: organization-remediation-test
services:
  mysql-test:
    image: mysql:8.4
    ports:
      - "127.0.0.1:13308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: isolated-test-only
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: organization_remediation_test
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_as_cs"]
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 40
